[package]
name = "conventional-commits-check"
version = "1.0.2"
edition = "2024"
description = "A lightweight library and CLI tool for validating Conventional Commits"
license = "MIT"
keywords = ["git", "commit", "conventional", "validation", "cli"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Sébastien LUNDI"]
repository = "https://codeberg.org/slundi/conventional-commits"

[badges]
maintenance = { status = "passively-maintained" }

[[bin]]
name = "commit-check"
path = "src/main.rs"

[lib]
name = "conventional_commits"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
thiserror = "2.0"
termcolor = "1.4"
toml-span = "0.7"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[workspace.metadata.cargo-machete]
ignored = []
